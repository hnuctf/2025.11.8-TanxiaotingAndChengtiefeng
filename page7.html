<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一周年纪念 - 爱情档案馆</title>
    <link type="text/css" rel="stylesheet" href="Love_files/smooth-navigation.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e, #302b63, #0f0c29);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            color: white;
        }

        /* 流星雨画布 */
        #meteor-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 主容器 */
        .anniversary-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 主标题 */
        .anniversary-title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd700 25%, #ff6b6b 50%, #ffd700 75%, #ff6b6b 100%);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite, titlePulse 2s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(255, 107, 107, 0.8);
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* 纪念日卡片 */
        .anniversary-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            animation: cardFloat 6s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* 纪念日信息 */
        .anniversary-date {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
            animation: glow 2s ease-in-out infinite alternate, dateGlow 3s ease-in-out infinite;
        }

        @keyframes glow {
            from { text-shadow: 0 0 25px rgba(255, 215, 0, 0.8); }
            to { text-shadow: 0 0 35px rgba(255, 215, 0, 1), 0 0 50px rgba(255, 215, 0, 0.8); }
        }

        @keyframes dateGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .anniversary-message {
            font-size: 1.8rem;
            color: #ffffff;
            margin: 25px 0;
            line-height: 1.6;
            font-weight: bold;
            text-align: center;
            background: linear-gradient(45deg, #ff6b6b, #ffd700, #ff6b6b);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: messageGradient 4s ease infinite;
        }

        @keyframes messageGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* 跳动感叹号样式 */
        .anniversary-message {
            font-size: 1.8rem;
            color: #ffffff;
            margin: 25px 0;
            line-height: 1.6;
            font-weight: bold;
            text-align: center;
            background: linear-gradient(45deg, #ff6b6b, #ffd700, #ff6b6b);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: messageGradient 4s ease infinite;
            position: relative;
            z-index: 1;
        }

        .exclamation-marks {
            display: block;
            text-align: center;
            margin: 15px 0;
            position: relative;
        }

        .exclamation-mark {
            display: inline-block;
            font-size: 2rem;
            font-weight: bold;
            color: #ff6b6b;
            margin: 0 8px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
            animation: exclamationJump 1.5s ease-in-out infinite;
            position: relative;
        }

        .exclamation-mark:nth-child(2) {
            animation-delay: 0.3s;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .exclamation-mark:nth-child(3) {
            animation-delay: 0.6s;
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
        }

        @keyframes exclamationJump {
            0%, 100% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 1;
            }
            25% {
                transform: translateY(-10px) scale(1.1) rotate(-3deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-18px) scale(1.2) rotate(3deg);
                opacity: 1;
            }
            75% {
                transform: translateY(-10px) scale(1.1) rotate(-1deg);
                opacity: 1;
            }
        }

        /* 爱心容器 */
        .heart-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 40px auto;
        }

        .heart {
            position: relative;
            width: 120px;
            height: 108px;
            margin: 0 auto;
            transform: rotate(-45deg);
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 192px;
            background: linear-gradient(135deg, #ff6b6b, #ffd700, #ff6b6b);
            border-radius: 120px 120px 0 0;
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.8);
            animation: heartGlow 2s ease-in-out infinite alternate;
        }

        @keyframes heartGlow {
            from { box-shadow: 0 0 40px rgba(255, 107, 107, 0.8); }
            to { box-shadow: 0 0 60px rgba(255, 215, 0, 1), 0 0 80px rgba(255, 107, 107, 0.6); }
        }

        .heart::before {
            left: 120px;
            top: 0;
        }

        .heart::after {
            left: 0;
            top: -84px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: rotate(-45deg) scale(1); }
            50% { transform: rotate(-45deg) scale(1.1); }
        }

        /* 爱心粒子 - 增强版 */
        .heart-particle {
            position: absolute;
            width: 25px;
            height: 25px;
            background: linear-gradient(135deg, #ff6b6b, #ffd700);
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 3s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.8);
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) scale(0) rotate(0deg);
                opacity: 0;
            }
            25% {
                opacity: 1;
                transform: translateY(-30px) scale(1.2) rotate(90deg);
            }
            50% {
                opacity: 1;
                transform: translateY(-60px) scale(1) rotate(180deg);
            }
            75% {
                opacity: 0.8;
                transform: translateY(-90px) scale(0.8) rotate(270deg);
            }
            100% {
                transform: translateY(-120px) scale(0) rotate(360deg);
                opacity: 0;
            }
        }

        /* 周年数字样式 */
        .anniversary-number {
            font-size: 4rem;
            font-weight: bold;
            color: #ff6b6b;
            margin: 20px 0;
            text-align: center;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
            animation: numberGlow 3s ease-in-out infinite alternate;
            display: inline-block;
            background: linear-gradient(45deg, #ff6b6b, #ffd700, #ff6b6b);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: numberGlow 3s ease-in-out infinite alternate, numberGradient 4s ease infinite;
        }

        @keyframes numberGlow {
            from { text-shadow: 0 0 30px rgba(255, 107, 107, 0.8); }
            to { text-shadow: 0 0 50px rgba(255, 215, 0, 1), 0 0 70px rgba(255, 107, 107, 0.6); }
        }

        @keyframes numberGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* 消息区域 */
        .message-section {
            margin-top: 30px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .love-message {
            font-size: 1.3rem;
            line-height: 1.8;
            margin-bottom: 15px;
            color: #f0f0f0;
            font-style: italic;
        }

        .signature {
            font-size: 1.2rem;
            color: #ffd700;
            font-weight: bold;
            margin-top: 20px;
        }

        /* 星星背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* 彩虹光晕 */
        .rainbow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 3px solid transparent;
            animation: rainbowRing 4s linear infinite;
            pointer-events: none;
        }

        @keyframes rainbowRing {
            0% {
                border-color: rgba(255, 0, 0, 0.5);
                transform: translate(-50%, -50%) scale(0.8);
            }
            25% {
                border-color: rgba(255, 165, 0, 0.5);
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                border-color: rgba(255, 255, 0, 0.5);
                transform: translate(-50%, -50%) scale(1.2);
            }
            75% {
                border-color: rgba(0, 128, 255, 0.5);
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                border-color: rgba(128, 0, 255, 0.5);
                transform: translate(-50%, -50%) scale(0.8);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .anniversary-title {
                font-size: 3rem;
            }

            .anniversary-card {
                padding: 30px 20px;
            }

            .anniversary-date {
                font-size: 1.5rem;
            }

            .days-count {
                font-size: 2.5rem;
            }

            .heart-container {
                width: 150px;
                height: 150px;
            }

            .heart,
            .heart::before,
            .heart::after {
                width: 75px;
                height: 120px;
            }

            .heart::before {
                left: 75px;
            }

            .heart::after {
                left: 0;
                top: -52.5px;
            }
        }

        /* 祝福语 */
        .blessing {
            position: absolute;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            pointer-events: none;
            animation: floatBlessing 6s ease-in-out infinite;
        }

        @keyframes floatBlessing {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* 增强导航样式 */
        .navigation {
            background: rgba(0, 0, 0, 0.8) !important;
            backdrop-filter: blur(15px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .progress-dot.active {
            background: #ffd700 !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8) !important;
        }

        .progress-dot.completed {
            background: #ff6b6b !important;
        }

        .music-toggle.playing {
            background: linear-gradient(135deg, #ffd700, #ff6b6b) !important;
            animation: musicPulse 2s infinite !important;
        }

        @keyframes musicPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }
    </style>
</head>

            <div class="anniversary-message">

            </div>

            <!-- 爱心动画 - 增强版 -->
            <div class="heart-container">
                <div class="heart"></div>
                <div class="heart-particle" style="top: 60px; left: 40px; animation-delay: 0s;"></div>
                <div class="heart-particle" style="top: 40px; right: 50px; animation-delay: 0.3s;"></div>
                <div class="heart-particle" style="bottom: 50px; left: 60px; animation-delay: 0.6s;"></div>
                <div class="heart-particle" style="bottom: 30px; right: 30px; animation-delay: 0.9s;"></div>
                <div class="heart-particle" style="top: 80px; left: 80px; animation-delay: 1.2s;"></div>

            <!-- 消息区域 -->

        <!-- 祝福语 - 周年版 -->
        <div class="blessing" style="top: 15%; left: 8%;">💕 一周年快乐 💕</div>
        <div class="blessing" style="top: 25%; right: 12%;">🎉 周年纪念 🎉</div>
        <div class="blessing" style="bottom: 35%; left: 15%;">❤️ 甜蜜一年 ❤️</div>
        <div class="blessing" style="bottom: 20%; right: 8%;">🌟 永远幸福 🌟</div>
        <div class="blessing" style="top: 45%; left: 5%;">✨ 爱你如初 ✨</div>
        <div class="blessing" style="top: 55%; right: 5%;">💝 天长地久 💝</div>
    </div>

    <script src="Love_files/simple-music-navigation.js"></script>
    <script>
        // 一周年纪念日 - 2025年11月8日
        const anniversaryDate = new Date('2025-11-08T13:31:00');

        // 检查是否是周年纪念日
        function checkAnniversaryDay() {
            const today = new Date();
            const isAnniversary = today.toDateString() === anniversaryDate.toDateString();

            const titleElement = document.querySelector('.anniversary-title');
            if (titleElement) {
                if (isAnniversary) {
                    titleElement.textContent = '🎉 今天是一周年纪念日 🎉';
                    // 添加特殊效果
                    titleElement.style.animation = 'gradientShift 1s ease infinite, titlePulse 0.5s ease-in-out infinite';
                } else {
                    titleElement.textContent = '一周年纪念';
                }
            }
        }

        // 创建周年纪念特殊效果
        function createAnniversaryEffects() {
            // 增加爱心粒子生成频率
            setInterval(() => {
                if (Math.random() < 0.5) {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight;
                    createHeartParticle(x, y);
                }
            }, 2000);
        }

        // 创建星星背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 200;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        // 流星雨效果
        class MeteorShower {
            constructor() {
                this.canvas = document.getElementById('meteor-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.meteors = [];
                this.resize();
                this.init();

                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                // 创建流星
                setInterval(() => {
                    if (Math.random() < 0.8) { // 80%概率创建流星
                        this.createMeteor();
                    }
                }, 200);

                // 动画循环
                this.animate();
            }

            createMeteor() {
                const meteor = {
                    x: Math.random() * this.canvas.width,
                    y: Math.random() * this.canvas.height * 0.5,
                    length: Math.random() * 80 + 20,
                    speed: Math.random() * 10 + 5,
                    opacity: Math.random() * 0.8 + 0.2,
                    angle: Math.random() * 30 + 30, // 30-60度角
                    color: this.getRandomColor()
                };

                this.meteors.push(meteor);
            }

            getRandomColor() {
                const colors = [
                    'rgba(255, 255, 255, 0.8)',  // 白色
                    'rgba(255, 215, 0, 0.6)',    // 金色
                    'rgba(255, 107, 107, 0.6)',  // 红色
                    'rgba(255, 255, 255, 0.4)',  // 银色
                    'rgba(255, 223, 0, 0.6)'      // 黄色
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // 更新和绘制流星
                for (let i = this.meteors.length - 1; i >= 0; i--) {
                    const meteor = this.meteors[i];

                    // 更新位置
                    meteor.x += Math.cos(meteor.angle * Math.PI / 180) * meteor.speed;
                    meteor.y += Math.sin(meteor.angle * Math.PI / 180) * meteor.speed;

                    // 绘制流星
                    this.ctx.save();
                    this.ctx.translate(meteor.x, meteor.y);
                    this.ctx.rotate(meteor.angle * Math.PI / 180);

                    // 流星轨迹
                    const gradient = this.ctx.createLinearGradient(0, 0, -meteor.length, 0);
                    gradient.addColorStop(0, meteor.color);
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    this.ctx.strokeStyle = gradient;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, 0);
                    this.ctx.lineTo(-meteor.length, 0);
                    this.ctx.stroke();

                    // 流星头部光晕
                    const headGradient = this.ctx.createRadialGradient(0, 0, 0, 0, 5);
                    headGradient.addColorStop(0, meteor.color);
                    headGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    this.ctx.fillStyle = headGradient;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, 3, 0, Math.PI * 2);
                    this.ctx.fill();

                    this.ctx.restore();

                    // 移除超出画布的流星
                    if (meteor.x > this.canvas.width || meteor.y > this.canvas.height || meteor.x < -meteor.length) {
                        this.meteors.splice(i, 1);
                    }
                }

                requestAnimationFrame(() => this.animate());
            }
        }

        // 添加额外的互动效果
        function addInteractiveEffects() {
            // 点击爱心创建涟漪效果
            const heartContainer = document.querySelector('.heart-container');

            heartContainer.addEventListener('click', (e) => {
                createRipple(e.pageX, e.pageY);

                // 创建额外的爱心粒子
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createHeartParticle(e.pageX, e.pageY);
                    }, i * 100);
                }
            });

            // 鼠标移动时的星光效果
            document.addEventListener('mousemove', (e) => {
                if (Math.random() < 0.05) { // 5%概率创建星光
                    createSparkle(e.pageX, e.pageY);
                }
            });
        }

        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.style.position = 'fixed';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.style.width = '0px';
            ripple.style.height = '0px';
            ripple.style.border = '2px solid rgba(255, 215, 0, 0.8)';
            ripple.style.borderRadius = '50%';
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.pointerEvents = 'none';
            ripple.style.zIndex = '1000';
            ripple.style.transition = 'all 0.8s ease-out';

            document.body.appendChild(ripple);

            setTimeout(() => {
                ripple.style.width = '200px';
                ripple.style.height = '200px';
                ripple.style.opacity = '0';
            }, 10);

            setTimeout(() => {
                ripple.remove();
            }, 800);
        }

        function createHeartParticle(x, y) {
            const particle = document.createElement('div');
            particle.style.position = 'fixed';
            particle.style.left = x + (Math.random() - 0.5) * 100 + 'px';
            particle.style.top = y + (Math.random() - 0.5) * 100 + 'px';
            particle.style.width = '10px';
            particle.style.height = '10px';
            particle.style.background = '#ff6b6b';
            particle.style.borderRadius = '50%';
            particle.style.pointerEvents = 'none';
            particle.style.zIndex = '999';
            particle.style.animation = 'particleAnimation 2s ease-out forwards';

            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 2000);
        }

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.style.position = 'fixed';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            sparkle.style.width = '4px';
            sparkle.style.height = '4px';
            sparkle.style.background = 'white';
            sparkle.style.borderRadius = '50%';
            sparkle.style.pointerEvents = 'none';
            sparkle.style.zIndex = '998';
            sparkle.style.animation = 'sparkleAnimation 1s ease-out forwards';

            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 1000);
        }

        // CSS动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes particleAnimation {
                0% {
                    transform: translate(-50%, -50%) scale(0);
                    opacity: 1;
                }
                100% {
                    transform: translate(-50%, -50%) scale(2);
                    opacity: 0;
                }
            }

            @keyframes sparkleAnimation {
                0% {
                    transform: scale(0);
                    opacity: 0;
                }
                50% {
                    transform: scale(1);
                    opacity: 1;
                }
                100% {
                    transform: scale(0);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            new MeteorShower();
            addInteractiveEffects();
            checkAnniversaryDay();
            createAnniversaryEffects();

            // 创建随机爱心粒子 - 周年版更频繁
            setInterval(() => {
                if (Math.random() < 0.4) {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight;
                    createHeartParticle(x, y);
                }
            }, 2000);
        });
    </script>
</body>
</html>
