<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>程铁峰 & 谭小婷</title>
    <link type="text/css" rel="stylesheet" href="Love_files/smooth-navigation.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 30%, #ff6b6b 60%, #4ecdc4 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        #content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            text-align: center;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 1s forwards;
            animation-delay: 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            from { text-shadow: 0 0 10px #fff; }
            to { text-shadow: 0 0 20px #ff6b6b, 0 0 30px #4ecdc4; }
        }

        #clock {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #clock span {
            display: inline-block;
            min-width: 2em;
            transition: all 0.3s ease;
        }

        #clock span:hover {
            transform: scale(1.2);
            color: #ff6b6b;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
    <div id="particles-js"></div>
    <div id="content">
        <h1>程铁峰 & 谭小婷</h1>
        <div id="clock">在一起 <span id="days">00</span> 天 <span id="hours">00</span> 时 <span id="minutes">00</span> 分 <span id="seconds">00</span> 秒</div>
    </div>

    <script>
        // 粒子效果配置
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 80 },
                "color": { "value": ["#ff6b6b", "#4ecdc4", "#ffe66d"] },
                "shape": { "type": "circle" },
                "opacity": { "random": true },
                "size": { "random": true },
                "move": {
                    "enable": true,
                    "speed": 3,
                    "direction": "none",
                    "out_mode": "out"
                }
            },
            "interactivity": {
                "events": {
                    "onhover": { "enable": true, "mode": "repulse" },
                    "onclick": { "enable": true, "mode": "push" }
                }
            }
        });

        // 鼠标轨迹粒子
        class MouseTrail {
            constructor() {
                this.particles = [];
                window.addEventListener('mousemove', (e) => this.createParticles(e));
            }
            
            createParticles(e) {
                for(let i=0; i<3; i++) {
                    const particle = document.createElement('div');
                    particle.style.cssText = `
                        position:fixed; 
                        width:5px; 
                        height:5px; 
                        background:#fff; 
                        border-radius:50%; 
                        pointer-events:none; 
                        left:${e.clientX}px; 
                        top:${e.clientY}px;
                        transition: transform 0.3s ease, opacity 0.5s ease;
                    `;
                    document.body.appendChild(particle);
                    
                    this.particles.push({
                        el: particle,
                        x: e.clientX,
                        y: e.clientY,
                        vx: (Math.random()-0.5)*2,
                        vy: -Math.random()*3
                    });
                }
                this.animate();
            }

            animate() {
                this.particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1;
                    p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
                    p.el.style.opacity = 1 - Math.abs(p.vy)/5;
                    
                    if(p.vy > 5) {
                        p.el.remove();
                        this.particles.splice(index, 1);
                    }
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        new MouseTrail();

        // 时间计算
        function updateTime() {
            const startDate = Date.parse('2024-11-08T00:00:00+08:00');
            const now = Date.now();
            const diff = now - startDate;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = Math.abs(days);
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
	<script src="Love_files/simple-music-navigation.js"></script>
	
</body>
</html>
